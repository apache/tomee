<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Register a passkey</title>
    <style>
        body{font-family:sans-serif;max-width:40em;margin:2em auto;line-height:1.5}
        label{display:block;margin:.5em 0}
        pre{background:#f4f4f4;padding:1em;white-space:pre-wrap}
    </style>
</head>
<body>
<h1>Register a passkey</h1>
<p>First authenticate with your password, then enrol an authenticator as a passkey.</p>
<form id="form">
    <label>Username <input id="username" value="jon"/></label>
    <label>Password <input id="password" type="password" value="doe"/></label>
    <button type="submit">Register passkey</button>
</form>
<pre id="log"></pre>
<p><a href="index.html">back</a></p>

<script src="js/webauthn.js"></script>
<script>
    document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            await passwordStep(document.getElementById('username').value,
                               document.getElementById('password').value);
            await registerPasskey();
        } catch (err) {
            log('ERROR: ' + err.message);
        }
    });
</script>
</body>
</html>
