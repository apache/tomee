<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <title>Log in</title>
    <style>
        body{font-family:sans-serif;max-width:40em;margin:2em auto;line-height:1.5}
        label{display:block;margin:.5em 0}
        pre{background:#f4f4f4;padding:1em;white-space:pre-wrap}
    </style>
</head>
<body>
<h1>Log in</h1>
<p>Password first, then your passkey. On success you are redirected to the
    protected page - a brand new request that only works if the login was
    persisted to the session.</p>
<form id="form">
    <label>Username <input id="username" value="jon"/></label>
    <label>Password <input id="password" type="password" value="doe"/></label>
    <button type="submit">Log in with password + passkey</button>
</form>
<pre id="log"></pre>
<p><a href="index.html">back</a></p>

<script src="js/webauthn.js"></script>
<script>
    document.getElementById('form').addEventListener('submit', async (e) => {
        e.preventDefault();
        try {
            await passwordStep(document.getElementById('username').value,
                               document.getElementById('password').value);
            await loginWithPasskey();
        } catch (err) {
            log('ERROR: ' + err.message);
        }
    });
</script>
</body>
</html>
